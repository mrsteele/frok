name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node scripts/check-source.mjs
      - name: Verify semantic version and lockfile
        id: version
        run: node scripts/release-version.mjs

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
          - os: macos-15-intel
            platform: mac-x64
          - os: windows-2025
            platform: win-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      FROK_SIGN_RELEASE: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm --prefix docs ci
      - name: Media build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm
      - name: Media build tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: make tar diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
      - name: Build bundled media tools (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: npm run build:media
      - name: Build bundled media tools (macOS and Linux)
        if: runner.os != 'Windows'
        run: npm run build:media
      - name: Preserve failed media compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: media-build-diagnostics-${{ matrix.platform }}
          path: .data/desktop-build-cache/media-build-error.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Desktop and storage checks (no inference)
        run: npm run test:release
      - name: Bundled video tools (synthetic clip, no AI inference)
        run: node --test tests/media-tool-distribution.test.mjs
      - name: Build platform installer
        run: npm run package
      - name: Check packaged backend (no inference)
        run: npm run smoke:desktop -- --packaged
      - name: Verify native update and tamper rejection (disposable apps)
        if: runner.os == 'macOS'
        run: |
          npm run smoke:updates
          npm run smoke:updates -- --tamper
      - name: Sign macOS update and generate architecture feed
        if: runner.os == 'macOS'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: node scripts/sparkle-appcast.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: frok-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/*.yml
            release/appcast-*.xml
            !release/builder-*.yml

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: frok-*
          path: downloaded-artifacts
      - name: Combine architecture downloads and verify update manifests
        run: node scripts/release-artifacts.mjs downloaded-artifacts artifacts
      - name: Attach installers to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        shell: bash
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS.txt
          cd ..
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json 2>/dev/null; then
            node -e "if (!JSON.parse(require('fs').readFileSync('existing.json')).isDraft) throw Error('Published releases are immutable; use a new version.')"
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --generate-notes --title "Frok $RELEASE_VERSION" "${flags[@]}"
          fi
